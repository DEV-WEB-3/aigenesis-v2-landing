<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none" role="img" aria-label="G1">
  <defs>
    <!-- black-chrome del chip: metal oscuro con luz arriba-izquierda -->
    <linearGradient id="g1ChipMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3050"/>
      <stop offset="0.42" stop-color="#0C0F1C"/>
      <stop offset="1" stop-color="#02040A"/>
    </linearGradient>
    <!-- bisel/rim: gradiente firma violeta -> cian -->
    <linearGradient id="g1Rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9D4DFF"/>
      <stop offset="0.55" stop-color="#00F5FF"/>
      <stop offset="1" stop-color="#6E56CF"/>
    </linearGradient>
    <!-- cromo plata para el monograma -->
    <linearGradient id="g1Chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#DCE3F5"/>
      <stop offset="0.55" stop-color="#AAB4D6"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <!-- vidrio de las órbitas -->
    <linearGradient id="g1Orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#9D4DFF" stop-opacity="0"/>
    </linearGradient>
    <!-- glass highlight superior del chip -->
    <linearGradient id="g1Sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- nodos: esfera de cristal -->
    <radialGradient id="g1NodeC" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#8FF6FF"/>
      <stop offset="1" stop-color="#00A6C4"/>
    </radialGradient>
    <radialGradient id="g1NodeV" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#C4A6FF"/>
      <stop offset="1" stop-color="#6E56CF"/>
    </radialGradient>
    <radialGradient id="g1NodeA" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FFCB9A"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </radialGradient>
    <!-- bloom controlado -->
    <filter id="g1Glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="g1Aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6E56CF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#00F5FF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sombra ambiental -->
  <ellipse cx="120" cy="205" rx="66" ry="12" fill="#02040A" opacity="0.55" filter="url(#g1Glow)"/>
  <!-- aura de convergencia -->
  <circle cx="120" cy="118" r="92" fill="url(#g1Aura)"/>

  <!-- ÓRBITAS (3, elípticas, cristal líquido) -->
  <g opacity="0.9" filter="url(#g1Glow)">
    <ellipse cx="120" cy="120" rx="98" ry="40" stroke="url(#g1Orbit)" stroke-width="2.2" transform="rotate(-24 120 120)"/>
    <ellipse cx="120" cy="120" rx="94" ry="36" stroke="url(#g1Orbit)" stroke-width="1.8" transform="rotate(28 120 120)" opacity="0.8"/>
    <ellipse cx="120" cy="120" rx="86" ry="30" stroke="url(#g1Orbit)" stroke-width="1.5" transform="rotate(78 120 120)" opacity="0.6"/>
  </g>

  <!-- NODOS (5, tamaños variados) -->
  <g filter="url(#g1Glow)">
    <circle cx="212" cy="104" r="6.5" fill="url(#g1NodeC)"/>
    <circle cx="36" cy="150" r="7.5" fill="url(#g1NodeV)"/>
    <circle cx="150" cy="46" r="5" fill="url(#g1NodeA)"/>
    <circle cx="70" cy="66" r="3.6" fill="url(#g1NodeC)"/>
    <circle cx="196" cy="176" r="4.2" fill="url(#g1NodeC)"/>
  </g>

  <!-- micro-partículas -->
  <g fill="#CFE9FF" opacity="0.7">
    <circle cx="98" cy="40" r="1.1"/>
    <circle cx="180" cy="70" r="0.9"/>
    <circle cx="52" cy="184" r="1.2"/>
    <circle cx="168" cy="196" r="0.9"/>
    <circle cx="220" cy="140" r="1"/>
  </g>

  <!-- MONOGRAMA G1 — chip black-chrome con bisel de marca -->
  <g>
    <rect x="76" y="76" width="88" height="88" rx="22" fill="url(#g1ChipMetal)" stroke="url(#g1Rim)" stroke-width="2.4"/>
    <!-- glass highlight superior -->
    <rect x="80" y="80" width="80" height="40" rx="18" fill="url(#g1Sheen)"/>
    <!-- glint especular esquina -->
    <path d="M88 86 q10 -4 24 -3" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    <!-- G1 en cromo plata -->
    <text x="120" y="134" text-anchor="middle" font-family="'Exo 2', 'Space Grotesk', system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="-1" fill="url(#g1Chrome)">G1</text>
  </g>
</svg>
